# Regional impact candidates (post_type=impact_report, type_method=null, conf 0.5).
impact_candidate:
  channels: regional
  pattern: 'наслідк|обстріл|обстрел|удар(ів|у|и|ом|ила|ив|яє|яли)?\b|влучан|влучил|пошкоджен|повреждён|поврежден|зруйнован|разрушен|загину|загибл|погиб|поранен|ранен|постраждал|пострадал|атакува|атаковал|прильот|приліт|прилет|вибух|взрыв|уламк|обломк|падіння|ракетн(ий|ого|им) удар|ворог (вдарив|атакував|бив|завдав)|ворожі (дрони|БпЛА|ракети)|сил(ами|и) ППО (збито|знищено)|збито'
  min_chars: 40

# ---------------------------------------------------------------------------
# weapon_class canon (L3/L4). Ukrainian, transliterations, Russian spellings.
# Matched case-insensitively against text spans; first class whose pattern hits.
# Note: decoys (Гербера, Пародія, імітатори) are counted under shahed =
# "one-way-attack UAV incl. decoys"; keep weapon_raw to separate them later.
# "Швидкісна ціль" is ambiguous (ballistic / supersonic cruise); mapped to ballistic, flagged by weapon_raw.
# ---------------------------------------------------------------------------
weapon_classes:
  kinzhal:
    - 'Кинджал|Кінджал|Kinzhal|Х-47|X-47|Х47'
  kab:
    - '\bКАБ[иіувами]*\b|керован(а|і|их|ими|ої) авіаційн(а|і|их|ими|ої) бомб|УМПБ|авіабомб|ФАБ|авиабомб|KAB\b|glide bomb'
  ballistic:
    - 'Іскандер-?\s?М\b|Искандер-?\s?М\b|Іскандер(?!-К)|Искандер(?!-К)|KN-?23|KN-?24|Кімскандер|Точка-У|Орєшнік|Орешник|Oreshnik|балістик|балістичн|баллистич|С-300|С-400|S-300|S-400|ОТРК|швидкісн(а|і) ціл'
  cruise:
    - 'Х-?101|X-?101|Х-?555|Х-?55\b|Х-?22|Х-?32|Х-?59|Х-?69|Х-?35|Х-?31|Х-?38|Калібр|Калибр|Kalibr|Іскандер-?К|Искандер-?К|Онікс|Оникс|Циркон|Бандероль|S8000|крилат|крылат|\bКР\b|КАР\b|cruise'
  jet_uav:
    - 'реактивн(ий|і|их|ого|им|ими|у) (БпЛА|БПЛА|дрон|безпілотник)|реактив[аи]?\b|РБпЛА|Герань-?\s?[34]\b|Shahed-?238|Гарпія-?3|jet.?drone'
  recon_uav:
    - 'розвідувальн|разведывательн|розвідник|Орлан|Zala|ZALA|Supercam|Мохаджер|Mohajer|Форпост|Ланцет|Lancet|Молнія|Молния'
  shahed:
    - 'Шахед|Шахід|Shahed|Герань|Герани|Geran|ударн(ий|і|их|ими|ого) (БпЛА|БПЛА|дрон|безпілотник)|дрон(и|ів)?-камікадзе|Гербер|Пародія|імітатор|безпілотник(и|ів)?-імітатор|УБпЛА|ІБпЛА|\bБпЛА\b|\bБПЛА\b|безпілотник|беспилотник|дрон'
  unknown:
    - 'авіаційн(их|і) засоб(ів|и) ураження|ракет'

# ---------------------------------------------------------------------------
# Oblast canon: ISO 3166-2:UA. Kyiv city (UA-30) is distinct from Kyiv oblast (UA-32).
# Patterns are stems (match case-insensitively, on the raw place string).
# Order matters: city-vs-oblast rules for Kyiv come before the oblast stem.
# ---------------------------------------------------------------------------
oblasts:
  UA-30: {name_uk: "м. Київ",            name_en: "Kyiv (city)",   is_city: true,
          patterns: ['^\s*(м\.?\s*)?Київ\b(?!щин|ськ)', 'Києв', '\bстолиц', 'Kyiv city', 'Киев\b']}
  UA-32: {name_uk: "Київська область",   name_en: "Kyiv oblast",
          patterns: ['Київщин', 'Київськ(а|ої|ій|у|ою) обл', 'Київська область', 'Киевск(ая|ой) обл', 'Kyiv (oblast|region)']}
  UA-05: {name_uk: "Вінницька",          name_en: "Vinnytsia",      patterns: ['Вінни(ц|ч)', 'Винниц', 'Vinnyts']}
  UA-07: {name_uk: "Волинська",          name_en: "Volyn",          patterns: ['Волин', 'Волын', 'Volyn']}
  UA-09: {name_uk: "Луганська",          name_en: "Luhansk",        patterns: ['Луган', 'Luhansk', 'Lugansk']}
  UA-12: {name_uk: "Дніпропетровська",   name_en: "Dnipropetrovsk", patterns: ['Дніпропетров', 'Днепропетров', 'Dnipropetrovsk']}
  UA-14: {name_uk: "Донецька",           name_en: "Donetsk",        patterns: ['Донец', 'Донеч', 'Donetsk']}
  UA-18: {name_uk: "Житомирська",        name_en: "Zhytomyr",       patterns: ['Житомир', 'Zhytomyr']}
  UA-21: {name_uk: "Закарпатська",       name_en: "Zakarpattia",    patterns: ['Закарпат', 'Zakarpat']}
  UA-23: {name_uk: "Запорізька",         name_en: "Zaporizhzhia",   patterns: ['Запорі[зж]', 'Запорож', 'Zaporizh']}
  UA-26: {name_uk: "Івано-Франківська",  name_en: "Ivano-Frankivsk",patterns: ['Івано-?Франків', 'Ивано-?Франков', 'Прикарпат', 'Ivano-Frankivsk']}
  UA-35: {name_uk: "Кіровоградська",     name_en: "Kirovohrad",     patterns: ['Кіровоград', 'Кировоград', 'Кропивниц', 'Kirovohrad', 'Kropyvnyts']}
  UA-40: {name_uk: "м. Севастополь",     name_en: "Sevastopol",     is_city: true, patterns: ['Севастопол', 'Sevastopol']}
  UA-43: {name_uk: "АР Крим",            name_en: "Crimea",         patterns: ['\bКрим', 'Крым', 'Crimea']}
