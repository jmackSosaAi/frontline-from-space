# ---------------------------------------------------------------------------
# Track extraction (20_extract_tracks.py). Pure regex. {PLACE} expands to a capitalised
# place-name token (one or two words, hyphens/apostrophes allowed). Added 2026-10-22 without
# touching the typing rules above (taxonomy `version` unchanged on purpose: 10_type_rules inputs same).
# ---------------------------------------------------------------------------
track_extraction:
  version: "tracks-1"
  place: "[А-ЯІЇЄҐ][а-яіїєґ'’ʼ\\-]+(?:-[А-ЯІЇЄҐ][а-яіїєґ'’ʼ]+)?(?:[ ][А-ЯІЇЄҐ][а-яіїєґ'’ʼ\\-]+)?"
  # emoji fallback when no weapon keyword in the segment
  emoji_weapon: {"🛵": shahed, "🏍": jet_uav, "🛸": recon_uav, "🅿": jet_uav}
  # oblast surface forms: -щина family, "<adj> області/обл.", Crimea, Prykarpattia
  oblast_form: "(?:[А-ЯІЇЄҐа-яіїєґ'’ʼ\\-]+(?:щин|ччин)[аиіуоюе]\\b|[А-ЯІЇЄҐа-яіїєґ]+(?:ськ|зьк|цьк)\\w*\\s+(?:областей|обл(?:асть|асті|\\.|ість)?)|\\bКрим\\w*|Прикарпатт\\w+|Закарпатт\\w+|Донбас\\w*|Полісс\\w+)"
  raion: "[А-ЯІЇЄҐа-яіїєґ'’ʼ\\-]+(?:ськ|цьк|зьк)(?:ий|ого|ому|ім|ому|ому)\\s+(?:район\\w*|р-н\\w*)|[А-ЯІЇЄҐа-яіїєґ'’ʼ\\-]+(?:ськ|цьк|зьк)(?:ий|ого|ому|ім)\\s+р\\.?"
  # counts: "13х", "3×", "1х", "2 групи", "дві групи"
  count_x: "(\\d{1,3})\\s*[хxX×✖]"
  count_word: "(\\d{1,3})\\s+(груп\\w*|ударн\\w*|нов\\w*|БпЛА|БПЛА|КР\\b|ракет\\w*|цілей|цілі|ціл\\w*|дрон\\w*|літак\\w*|\\w*Герань\\w*|Шахед\\w*)"
  count_vague: "(декілька|кілька|низка|кілька|велик\\w+ груп\\w*|багато)"
  # location-style markers (settlement is where the track IS)
  loc_markers: "\\(|(?:в|у)\\s+р-ні\\.?|р-ні\\.?|(?:південн|північн|східн|західн)іше(?:\\s+від)?|узбережж\\w+|вздовж|повз|біля|поблизу|в\\s+районі|у\\s+районі|над|через|околиц\\w+|в\\s+околицях|навколо|довкола|в\\s+межах|у\\s+межах|в\\s+бік\\s+від|н\\.\\s?п\\.|м\\.\\s?|смт\\.?|с\\.\\s?|селищ\\w+|місто|міста|села|в|у|по"
  # target-style markers (where it is heading)
  tgt_markers: "→|вектор\\w*|курсом\\s+на|у\\s+напрямку|в\\s+напрямку|у\\s+напрямі|в\\s+напрямі|у\\s+бік|в\\s+бік|до|на|напрямок"
  origin_markers: "від|з|із|зі"
  heading: "(?<![\\p{L}])(?:курс\\w*[^.;\\n]{0,60}|\\b\\w+(?:им|ім)\\s+курсом[^.;\\n]{0,30}|(?<![\\p{L}])(?:у|в)\\s+(?:\\w+(?:ому|ій|ім)\\s+)?напрям\\w*[^.;\\n]{0,50}|(?<![\\p{L}])(?:у|в)\\s+бік[^.;\\n]{0,50}|(?<![\\p{L}])(?:з|із|від)\\s+(?:півдн\\w+|північ|півночі|схід|сходу|захід|заходу|південного|північного)[^.;\\n]{0,40}|вектор\\w*\\s+[^.;\\n]{0,40}|рухаються?\\s+[^.;\\n]{0,40}|рух\\s+[^.;\\n]{0,40})"
  stop_place: "^(Захід\\w*|Схід\\w*|Сход\\w*|Північ\\w*|Півден(?:ь|ного|ному|ний|ною)(?![\\p{L}])|Півн\\w*|Півд(?:ні|ня|нів)(?![\\p{L}])|Лівого|Лівому|Правого|Правому|Центр|Правобереж|Лівобереж|Ліве|Праве|Лівий|Правий|Увага|Уважн|Курс|Груп|Ціл|Ракет|БпЛА|Шахед|Герань|Нові|Нове|Нових|Ворож|Російськ|Рух|ТОТ|Область|Район|Сторон|Загроз|Перебувайте|Не\\b|Повітряна|Тривога|Відбій|Висот|Зниж|Залишки|Окрем|Кілька|Декілька|Чорного|Чорне|Азовськ|Каспій|Балтій|Білорус|Біларус|Росі|Територі|Українськ|Укрит|Ударн|Імітац|Швидкіс|Крилат|Балістичн|Реактивн|Розвідув|Одинарн|Звичайн|Великі|Великих|Мала|Малих|Калібр|Калібри|Іскандер|Кінджал|Кинджал|Орлан|Герб|Парод|Мохаджер|Ту-|МіГ|Х-|Група|Пара|Нове|Реактив|Крилат|Бандероль|Остання|Останній|Ймовірно|Перша|Перший|Також|Власне|Можливо|Попередньо|Одна|Один|Ще|Далі|Х$|Х-?\\d)"
  # city -> oblast ISO inference when no oblast form is present (only unambiguous regional centres)
  city_iso:
    UA-30: '^(м\.\s?)?Київ$|^Києв\w*$|^Киє\w*$'
    UA-12: '^Дніпр(о|а|у|ом|і)$|^Кривий Ріг$|^Кривого Рогу$|^Павлоград\w*$|^Нікополь\w*$|^Самар\w*$'
    UA-51: '^Оде(са|си|сі|су|сою)$|^Ізмаїл\w*$'
    UA-63: '^Харків\w*$|^Харкова$'
    UA-23: '^Запоріж\w*$'
    UA-48: '^Миколаїв\w*$|^Миколаєва$|^Вознесенськ\w*$'
    UA-65: '^Херсон\w*$'
    UA-53: '^Полтав\w*$|^Кременчу\w*$|^Миргород\w*$'
    UA-59: '^Сум(и|ах|ам|ами)$|^Конотоп\w*$|^Шостк\w*$|^Охтирк\w*$'
    UA-74: '^Чернігів\w*$|^Ніжин\w*$|^Прилук\w*$'
    UA-18: '^Житомир\w*$|^Коростен\w*$'
    UA-71: '^Черкас\w*$|^Умань\w*$|^Умані$'
    UA-05: '^Вінниц\w*$|^Жмеринк\w*$|^Гайсин\w*$'
    UA-46: '^Львів\w*$|^Львова$'
    UA-35: '^Кропивницьк\w*$|^Олександрі\w*$'
    UA-14: '^Краматорськ\w*$|^Слов.янськ\w*$|^Донецьк\w*$'
    UA-56: '^Рівн\w*$'
    UA-68: '^Хмельницьк\w*$'
    UA-32: '^Біла Церква$|^Білої Церкви$|^Бровар\w*$|^Борисп\w*$|^Фастів\w*$|^Васильк\w*$|^Бучу?$|^Ірпін\w*$'
