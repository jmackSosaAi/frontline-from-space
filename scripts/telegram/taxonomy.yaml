# Telegram pipeline vocabulary (planning/TELEGRAM_PIPELINE.md §1.7, §L2, §L4).
# This file is the contract for L2 typing and L4 resolution. Changing it after QA
# needs a dated note in planning/TELEGRAM_PIPELINE.md.
version: "2026-10-22.13"

# ---------------------------------------------------------------------------
# post_type label set (fixed, 10 labels)
# ---------------------------------------------------------------------------
post_types:
  track:             "Weapon(s) observed in flight: position / heading / target (drones, cruise, 'fast target')."
  launch:            "Launch or launch-threat statement: missile/KAB launches, ballistic threat, 'пуски'."
  launch_intel:      "Carrier / platform intel: Tu-95, MiG-31K, ships, airfields, take-offs, situation reports."
  alert:             "Air-raid alert / generic warning ('Увага', 'тривога', 'в укриття', 'ракетна небезпека')."
  all_clear:         "Threat lifted ('Відбій', 'чисто')."
  aviation_activity: "Enemy tactical aviation active (no launch stated)."
  daily_summary:     "Air Force nightly/daily totals; monitor daily 'Зведення'."
  impact_report:     "Report of explosions, strikes, damage, casualties on UA territory. Tier A from officials; tier C (monitors) = 'explosion heard', timing only."
  ua_strike_on_ru:   "Explosions / strikes on RU or occupied territory attributed to UA."
  other:             "Everything else (politics, aid, news, GenStaff summaries)."

# Interpretation decisions (so downstream agrees):
#   - "Загроза балістики / балістичного озброєння" -> launch (ballistic launch warning; spec ☄ -> launch).
#   - "Швидкісна ціль", "КР/ракета на <place>" -> track (weapon already in flight).
#   - "Пуски", "Запуск", "КАБи на <oblast>", 🚀/💣 -> launch.
#   - Monitor "📡 Обстановка станом на" -> launch_intel (carrier / airfield status snapshot).
#   - Monitor "Дорозвідка" (re-scan, nothing new) -> other.
#   - Regional-admin posts matching impact keywords are impact_report CANDIDATES:
#     post_type=impact_report, type_method=null, type_conf=0.5 until the LLM typer confirms.

# ---------------------------------------------------------------------------
# Emoji type codes per channel group (lead grapheme). Used by 10_type_rules.py
# together with the regex rules below; emoji alone is never enough for monitors.
# ---------------------------------------------------------------------------
emoji_codes:
  kpszsu:
    "🛵": {post_type: track, weapon_class: shahed}
    "🏍": {post_type: track, weapon_class: jet_uav}
    "🛸": {post_type: track, weapon_class: recon_uav}
    "🚀": {post_type: launch, weapon_class: unknown}      # missiles or KAB; text decides
    "💣": {post_type: launch, weapon_class: kab}
    "☄": {post_type: launch, weapon_class: ballistic}
    "⚠": {post_type: alert}
    "🚨": {post_type: alert}
    "📢": {post_type: all_clear}
    "🛫": {post_type: aviation_activity}
    "🛬": {post_type: aviation_activity}
    "⚡": {post_type: daily_summary}                        # only with the summary regex; else other
    "🇺": {post_type: other}                                # 🇺🇦 GenStaff reposts
  war_monitor:
    "❗": {post_type: track}      # region-prefixed track; text decides
    "‼": {post_type: alert}      # urgent, usually Kyiv ballistic
    "⚠": {post_type: alert}      # threat / activity; text decides
    "🅿": {post_type: track, weapon_class: jet_uav}
    "🟣": {post_type: launch, weapon_class: ballistic}
    "📡": {post_type: launch_intel}
    "💥": {post_type: impact_report}
    "⚪": {post_type: all_clear}
    "🟢": {post_type: all_clear}
    "🔴": {post_type: alert}
    "⚡": {post_type: other}      # AD working / news; text decides
  monitoringwar:
    "❗": {post_type: track}
    "‼": {post_type: alert}
    "⚠": {post_type: alert}
    "📡": {post_type: launch_intel}
    "💥": {post_type: impact_report}
    "⚪": {post_type: all_clear}
    "🟢": {post_type: all_clear}
    "🔴": {post_type: alert}
    "⚡": {post_type: other}
  VA_Kyiv:
    "🔴": {post_type: alert}
    "🟡": {post_type: alert}
    "🟢": {post_type: all_clear}
    "🟩": {post_type: all_clear}
    "📢": {post_type: alert}
    "💣": {post_type: impact_report}
  zoda_gov_ua:
    "🚨": {post_type: alert}      # also "🚨 Відбій" -> all_clear by regex
    "✅": {post_type: all_clear}
  odeskaODA:
    "🔴": {post_type: alert}
    "🟢": {post_type: all_clear}
  synegubov:
    "📍": {post_type: impact_report}
    "🔻": {post_type: impact_report}
  dnipropetrovskaODA:
    "❗": {post_type: impact_report}
    "▪": {post_type: impact_report}

# ---------------------------------------------------------------------------
# post_type regex rules. Evaluated in order; first match wins. Flags: IGNORECASE.
# `channels`: list or "monitor" / "official_af" / "regional" / "all".
# `conf`: type_conf written when the rule fires.
# Patterns are matched against text_norm (NFC, whitespace-collapsed).
# ---------------------------------------------------------------------------
channel_groups:
  official_af: [kpszsu]
  monitor: [war_monitor, monitoringwar]
  regional: [VA_Kyiv, dnipropetrovskaODA, kozytskyy_maksym_official, odeskaODA, synegubov, zoda_gov_ua]

type_rules:
  # ---- Air Force single-intercept news (not a nightly summary) ------------------
  - {name: af_intercept_news, channels: official_af, post_type: other, conf: 0.85,
     pattern: '^\s*(⚡️?\s*)?(ЗНИЩЕНО|МІНУС|ЗБИТО) (ШТУРМОВИК|ЛІТАК|ВЕРТОЛІТ|ГЕЛІКОПТЕР|ВОРОЖИЙ|РОСІЙСЬК|Су-|КРИЛАТА РАКЕТА|ВИНИЩУВАЧ)'}
  # ---- daily summaries -----------------------------------------------------
  - {name: af_day_summary, channels: official_af, post_type: daily_summary, conf: 0.9,
     pattern: '^\s*❗?️?\s*(Протягом (дня|доби)|Удень|Вдень) .{0,100}(противник|ворог) атакував'}
  - {name: af_night_summary, channels: official_af, post_type: daily_summary, conf: 0.98,
     pattern: '^\s*⚡?️?\s*[^\n]{0,80}(ЗБИТО|ЗНИЩЕНО|ПОДАВЛЕНО|ЗНЕШКОДЖЕНО|У ніч на)', min_chars: 250}
  - {name: af_night_summary_body, channels: official_af, post_type: daily_summary, conf: 0.95,
     pattern: 'У ніч на .{0,120}(противник|ворог|окупант)[^.]{0,40}(атакував|завда[вл]|застосував)', min_chars: 400}
  - {name: af_2022_daily_kills, channels: official_af, post_type: daily_summary, conf: 0.9,
     pattern: '^\s*❗?️?\s*\d{1,2} \S+ 2022 року[^.]{0,120}(знищ|уражен|збит)'}
  - {name: mon_daily_zvedennia, channels: monitor, post_type: daily_summary, conf: 0.95,
     pattern: '^\s*(📡\s*)?Зведення про діяльність|^\s*🔱\s*(В ніч на|У період (із|з)|У ніч на|Вночі|Вдень|Протягом|ПС ЗСУ|Повітряні [Сс]или)|^\s*\S{0,4}\s*Підсумок (поточної )?доби|^\s*\S{0,4}\s*(Уночі|У ніч на|Вночі) \d{1,2} \S+ 20\d\d року|^\s*\S{0,4}\s*У ніч на \d{2}\.\d{2}\.\d{2}|^\s*Ракетна атака \d{2}\.\d{2}|^\s*Тут оновлюватиму підсумки|^\s*\S{0,4}\s*(Ворогом|Противником) було застосовано|^\s*Станом на \d{1,2}:\d{2} збито'}
  # ---- obvious noise first (so keyword rules below don't grab it) ----------
  - {name: genstaff_repost, channels: all, post_type: other, conf: 0.95,
     pattern: 'Генеральний штаб ЗС України|щодо російського вторгнення|Загальні бойові втрати противника'}
  - {name: presidential_address, channels: regional, post_type: other, conf: 0.95,
     pattern: '^\s*‼️?\s*Київ, Банкова'}
  - {name: daily_briefing_promo, channels: regional, post_type: other, conf: 0.9,
     pattern: '^\s*(🕯\s*)?(Щоденно|Щодня|Щоранку) о'}
  - {name: website_link_only, channels: all, post_type: other, conf: 0.95,
     pattern: '^\s*(https?://|🇺🇦 Сайт|The situation (in|regarding)|Новини /|#stoprussia)'}
  - {name: meetings, channels: regional, post_type: other, conf: 0.9,
     pattern: '^\s*(Зустрівся|Провів сьогодні|Говорив із|Взяв участь|Під час (наради|зустрічі|робочої)|Провів Ставку|Зустріч із)'}
  - {name: af_pilot_loss, channels: official_af, post_type: other, conf: 0.9,
     pattern: 'На жаль, сумна новина|загинув .{0,40}(пілот|льотчик)|^\s*Відео |^\s*🎥'}
  - {name: intercept_note, channels: [kpszsu, war_monitor, monitoringwar], post_type: other, conf: 0.8,
     pattern: '^\s*\S{0,4}\s*((КР|БР|Ціль|ціль|БпЛА|Ракета|ракета) )?(Мінус|МІНУС|Плюс|Припинил[аи] (своє )?існування|Знищення ворож|Збиття|Знищен[оаі]|Збито|Х-\d+ знищено|Ціл[ьі] (знищен|збит)|Бойова робота)\b|^\s*⚡️?\s*(Збиття|Знищен|Збито|В районі м\.\S+ збито)', max_chars: 200}
  - {name: mon_dorozvidka, channels: monitor, post_type: other, conf: 0.85,
     pattern: '^(?![^\n]{0,30}Обстановка)(?![\s\S]{0,80}виявлено)(?![\s\S]{0,200}\d\s*[хx×] ?[А-ЯІЇЄҐрБК])(?:[\s\S]*?)(дорозвідк|локаційн(о|а) (втрат|втрачен)|зникл[аио] (з|із) радар|без локаційного|локаційно втрачен|без подальшого фіксування|без подальшої фіксації|без фіксації)', max_chars: 220}
  # ---- Air Force emoji tracks (highest-volume, cleanest signal) ------------
  - {name: track_af_emoji, channels: official_af, post_type: track, conf: 0.97,
     pattern: '^.{0,40}(🛵|🏍|🛸)(?![^\n]{0,60}загроза (застосування|ударних|ворожих))'}
  # ---- all clear -----------------------------------------------------------
  - {name: all_clear, channels: all, post_type: all_clear, conf: 0.97,
     pattern: '^[^\n]{0,70}(?<![а-яіїєґa-z])(відбій|отбой)(?![а-яіїєґa-z])'}
  - {name: all_clear_green_uvaga, channels: regional, post_type: all_clear, conf: 0.95,
     pattern: '^\s*🟢\s*УВАГА!?[^\n]{0,90}Відбій'}
  - {name: sonic_boom_note, channels: monitor, post_type: other, conf: 0.85,
     pattern: '[Кк]онус [Мм]аха|погодними умовами|\bгрім\b|\bгроза\b|Почему тревогу'}
  - {name: all_clear_chisto, channels: monitor, post_type: all_clear, conf: 0.9,
     pattern: '^[^!?\n]{0,70}(?<![а-яіїєґ])(чисто|загроза минула|цілей немає)(?![а-яіїєґ])', max_chars: 220}
  # ---- siren alerts (template posts; before launch so reason-clauses don't steal them) ----
  - {name: launch_pusk_lead, channels: [kpszsu, war_monitor, monitoringwar], post_type: launch, conf: 0.9,
     pattern: '^\s*\S{0,4}\s*(Ще |Повторн[іи]й? |Нові )?(Пуск[иу]?|Запуск[иу]?|Вихід|Виходи|Авіабомби)\b'}
  - {name: track_missile_lead, channels: [kpszsu, war_monitor, monitoringwar], post_type: track, conf: 0.9,
     pattern: '^\s*\S{0,4}\s*(Ще одна |Ще )?(Крилат[аі] ракет[аи]|КР|Ракет[аи]|Швидкісн[аі] ціл[ьі]) (курсом|повз|на|у напрямку|в напрямку|через)\b'}
  - {name: launch_ballistic_lead, channels: [kpszsu, war_monitor, monitoringwar], post_type: launch, conf: 0.9,
     pattern: '^\s*\S{0,4}\s*(Ще |Повторн[аі] )?(Балістик[аи] (на|з|із|курсом|у|в|по)\b|Балістичн[аі] ракет[аи] (повз|курсом|на|у напрямку|в напрямку))'}
  - {name: alert_siren, channels: all, post_type: alert, conf: 0.96,
     pattern: '^[^\n]{0,80}(повітряна тривога|повітряну тривогу|повітряної тривоги|оголошен[ао] тривог|air raid|ракетна небезпека|ракетну небезпеку|ракетної небезпеки|жовтий рівень|червоний рівень|негайно прямуйте|терміново в укриття|в укриття[!.]|до укриття|в укритті|в укриттях|укриття!|УВАГА🚨|Початок тривоги|угроз[аы] (обстрела|ракетн|удар|применения)|опасность|підвищеної небезпеки|сигнал [^\n]{0,20}небезпеки|загроза обстрілу|укрыти[яе]|воздушная тревога)|^\s*В укриття'}
  # ---- UA strikes on RU / occupied territory -------------------------------
  - {name: alert_uav_threat_lead, channels: monitor, post_type: alert, conf: 0.85,
     pattern: '^\s*(\d{1,2}:\d{2}\s*)?Загроза (ударних )?БпЛА (лишається|триває|для|зберігається)'}
  - {name: mon_politics_news, channels: monitor, post_type: other, conf: 0.8,
     pattern: '^\s*⚡️?\s*За інформацією (Західних )?ЗМІ|Байден|Трамп|Пентагон|Конгрес|Білий дім|дозволено використання|Іл-76ТД|Pouya|іранськ(ий|ого|ій) (вантажн|борт)|Рік тому'}
  - {name: ua_strike_ru, channels: monitor, post_type: ua_strike_on_ru, conf: 0.85,
     pattern: '^\s*(🦫|🦉)|ураження (БДК|корабл|фрегат|МРК|підводн|крейсер)|(Таганроз|Таганрог|Ростов|Енгельс|Бєлгород|Белгород|Білгород|Брянськ|Курськ|Воронеж|Севастопол|Крим|Джанко|Саки|Сімферопол|Євпаторі|Феодосі|Керч|Гвардійськ|Бельбек|Новоросійськ|Міллерово|Морозовськ|Смоленськ|московськ|Москв|Капотн|Шатур|Електростал|ГРЕС|ГЕС|Кахов|Краснодар|Клинц|Ярослав|Новошахтинськ|Туапсе|Волгоград|Саратов|Самар|Липецьк|Тул[аи]\b|Калу[гз]|Пенз|Тамбов|Твер|Псков|Петербур|Ленінград|Татарстан|Єлабуг|Ульянов|Рязан|Орл(а|і|ов)\b|Орел\b|Донецьк\b|Луганськ\b|Мелітопол|Бердянськ|Маріупол|Горлівк|Макіївк|Енергодар|Токмак|Скадовськ|НПЗ|нафтобаз|на рф|по рф|територі[яї] рф|ТОТ|Т\.О\.?|т\.о\.?|окупован|патрульн|корабел|корабль|танкер|суд(ен|на|но)\b|Азовськ(ому|е) мор|Чорноморськ(ий|ого) флот|ЧФ рф)[^.]{0,120}(вибух|прильот|приліт|бавовн|ураж|влучан|під обстрілом|під атакою|атакован|атак(а|и|у|ою) (невстановлен|БпЛА|дрон|ударних)|палає|пожеж|знищен|детонац|HIMARS|ATACMS|Storm Shadow|Нептун)|(вибух|прильот|бавовн|уражен|атакован|влучан)[^.]{0,80}\b(у|в|на|та|і) (районі |місті |м\.\s?|Нов(ій|ой|а) )?(Таганроз|Таганрог|Ростов|Енгельс|Бєлгород|Белгород|Білгород|Брянськ|Курськ|Воронеж|Севастопол|Крим|Джанко|Саки|Сімферопол|Євпаторі|Феодосі|Керч|Гвардійськ|Бельбек|Новоросійськ|Міллерово|Морозовськ|Смоленськ|московськ|Москв|Капотн|Шатур|Електростал|ГРЕС|ГЕС|Кахов|Краснодар|Клинц|Ярослав|Новошахтинськ|Туапсе|Волгоград|Саратов|Самар|Липецьк|Тул[аи]\b|Калу[гз]|Пенз|Тамбов|Твер|Псков|Петербур|Ленінград|Татарстан|Єлабуг|Ульянов|Рязан|Орл(а|і|ов)\b|Орел\b|Донецьк\b|Луганськ\b|Мелітопол|Бердянськ|Маріупол|Горлівк|Макіївк|Енергодар|Токмак|Скадовськ|НПЗ|нафтобаз|на рф|по рф|територі[яї] рф|ТОТ|Т\.О\.?|т\.о\.?|окупован|патрульн|корабел|корабль|танкер|суд(ен|на|но)\b|Азовськ(ому|е) мор|Чорноморськ(ий|ого) флот|ЧФ рф)|Результат точн|Работа HIMARS|Ураження (сил|позицій|скупчення) ворога|(HIMARS|ATACMS|Storm Shadow|SCALP|Нептун|Фламінго)[^\n]{0,40}(по |ураж|удар|влуч)', max_chars: 350}
  - {name: ru_ad_working, channels: monitor, post_type: launch_intel, conf: 0.85,
     pattern: '^(?![^\n]{0,40}(Загроза|загрозу) балістик)(?:[^\n]*?)((працює|робота|роботу|відмічено роботу) (ворожої |ворожих )?(ЗРК )?(С-300|С-400|ППО рф|ППО (противника|ворога))|Робот[ау] ворожої ППО)'}
  - {name: mon_explosion_lead, channels: monitor, post_type: impact_report, conf: 0.85,
     pattern: '^\s*💥[^\n]{0,100}(вибух|взрыв|влучан|прильот|приліт|удар(?!н)|падає|падають|атаку|гатять|обстріл)'}
  # ---- ballistic threat + recon UAV before carrier intel (they share keywords) ----
  - {name: launch_ballistic_threat, channels: all, post_type: launch, conf: 0.9,
     pattern: 'Загроз[аиу] (застосування |використання |ударів )?(балістик|балістичн|ракет(ного|и)? (середньої|великої) дальн|Орєшнік|Кинджал|Кінджал|наземних пускових|ОТРК|ЗРК/ОТРК)|балістичн(ого|ої)? (озброєння|ракет)[^.]{0,40}(загроз|з |із )|^\s*(❗️?|⚠️?|🟣|☄️?|\+|🚀|‼️?)?\s*(Ще |Повторн[аі] )?Балістик[аи]\b|^\s*(❗️?|‼️?|🚀)?\s*Балістичн|^\s*(❗️?|‼️?)?\s*[А-ЯІЇЄҐ][^—–\n]{0,30}\s*[—–-]\s*(спуск |наближення )?балістик|Активність (наземних )?пускових|наземних пускових (комплексів|установок)|спуск балістики|^\s*☄'}
  - {name: track_recon_uav, channels: all, post_type: track, conf: 0.9,
     pattern: 'розвідувальн(ий|і|ого|их) БпЛА|розвідник (над|у|в)|Орлан|Zala|Supercam|Мохаджер|Форпост', max_chars: 300}
  - {name: alert_uav_direction, channels: monitor, post_type: alert, conf: 0.85,
     pattern: '^\s*⚠️?\s*Загроза ударних БпЛА (з|із) [^\n]{0,60}напрямку'}
  - {name: launch_pusk, channels: all, post_type: launch, conf: 0.95,
     pattern: '^\s*(❗️?|⚠️?|🚀|💣|☄️?|🟣|‼️?|\+|📡)?\s*(Повторн[іи]й? |Нові )?(Пуск[иу]?|Запуск[иу]?|Старт|Вихід (БР|Циркон|ракет|Кинджал|балістик|у напрямку|[А-ЯІЇЄҐ])|Виходи)\b|(Пуск[иу]?|Запуск) (КАБ|керован|ракет|крилат|балістичн|С-300|Іскандер|Калібр|Х-|УМПБ|авіаційн|дрон|БпЛА|фальш)|(відмічен[оі]|зафіксован[оі]|фіксу(ємо|ються|вали)|було) (пуск|запуск|старт)|пуски (БпЛА|дронів|шахед|ракет)|вих(ід|оди) балістик|(здійснено|здійснив|виконав|зафіксовано) (додатковий |повторний |масовані? )?(запуск|пуск)'}
